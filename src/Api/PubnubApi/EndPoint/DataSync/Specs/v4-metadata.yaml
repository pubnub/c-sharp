openapi: 3.0.3
info:
  title: Object Management API
  version: 4.0.0
paths:
  /datasync/subkeys/{subKey}/entity-classes:
    get:
      operationId: listEntityClasses
      summary: Get all entity class entries
      parameters:
        - $ref: "common.yaml#/components/parameters/SubKeyPath"
      responses:
        "200":
          $ref: "#/components/responses/EntityClassesResponse"
        "400":
          $ref: "common.yaml#/components/responses/BadRequestResponse"
        "401":
          $ref: "common.yaml#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "common.yaml#/components/responses/ForbiddenResponse"
        "406":
          $ref: "common.yaml#/components/responses/NotAcceptableResponse"
        "429":
          $ref: "common.yaml#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "common.yaml#/components/responses/InternalServerErrorResponse"
        "503":
          $ref: "common.yaml#/components/responses/ServiceUnavailableResponse"
      tags:
        - Entity Class

  /datasync/subkeys/{subKey}/entity-classes/{entityClass}/versions/{entityClassVersion}:
    post:
      operationId: createEntityClass
      summary: Create a new entity class
      description: |
        Creates a new entity class with its registry configuration, property definitions.
      parameters:
        - $ref: "common.yaml#/components/parameters/SubKeyPath"
        - $ref: "#/components/parameters/EntityClassPath"
        - $ref: "#/components/parameters/EntityClassVersionPath"
      tags:
        - Entity Class
      requestBody:
        required: true
        content:
          application/vnd.pubnub.objects.entity-class+json;version=1:
            schema:
              $ref: '#/components/schemas/CreateEntityClassRequest'
      responses:
        '201':
          $ref: "#/components/responses/CreateEntityClassResponse"
        '400':
          $ref: 'common.yaml#/components/responses/BadRequestEntityClassWriteResponse'
        '401':
          $ref: 'common.yaml#/components/responses/UnauthorizedResponse'
        '403':
          $ref: 'common.yaml#/components/responses/ForbiddenResponse'
        "406":
          $ref: "common.yaml#/components/responses/NotAcceptableResponse"
        '409':
          $ref: 'common.yaml#/components/responses/ConflictResponse'
        "415":
          $ref: "common.yaml#/components/responses/UnsupportedMediaTypeResponse"
        "429":
          $ref: "common.yaml#/components/responses/TooManyRequestsResponse"
        '500':
          $ref: 'common.yaml#/components/responses/InternalServerErrorResponse'
        '503':
          $ref: 'common.yaml#/components/responses/ServiceUnavailableResponse'

    get:
      tags:
        - Entity Class
      operationId: getEntityClass
      summary: Get entity class by ID
      parameters:
        - $ref: "common.yaml#/components/parameters/SubKeyPath"
        - $ref: "#/components/parameters/EntityClassPath"
        - $ref: "#/components/parameters/EntityClassVersionPath"
        - $ref: "common.yaml#/components/parameters/EntityClassLevelQuery"
      responses:
        "200":
          $ref: "#/components/responses/EntityClassResponse"
        "400":
          $ref: "common.yaml#/components/responses/BadRequestResponse"
        "401":
          $ref: "common.yaml#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "common.yaml#/components/responses/ForbiddenResponse"
        "404":
          $ref: "common.yaml#/components/responses/NotFoundResponse"
        "406":
          $ref: "common.yaml#/components/responses/NotAcceptableResponse"
        "429":
          $ref: "common.yaml#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "common.yaml#/components/responses/InternalServerErrorResponse"
        "503":
          $ref: "common.yaml#/components/responses/ServiceUnavailableResponse"

    patch:
      tags:
        - Entity Class
      operationId: patchEntityClass
      summary: Patch entity class using Json Patch RFC-6902
      parameters:
        - $ref: "common.yaml#/components/parameters/SubKeyPath"
        - $ref: "#/components/parameters/EntityClassPath"
        - $ref: "#/components/parameters/EntityClassVersionPath"
        - $ref: "common.yaml#/components/parameters/IfMatchHeader"
      requestBody:
        required: true
        x-codegen-request-body-name: patch
        content:
          application/json-patch+json:
            schema:
              $ref: "common.yaml#/components/schemas/JsonPatch"
            example:
              - op: replace
                path: /status
                value: moderator
              - op: add
                path: /custom/role
                value: admin
      responses:
        "200":
          $ref: "#/components/responses/EntityClassResponse"
        "400":
          $ref: "common.yaml#/components/responses/BadRequestResponse"
        "401":
          $ref: "common.yaml#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "common.yaml#/components/responses/ForbiddenResponse"
        "404":
          $ref: "common.yaml#/components/responses/NotFoundResponse"
        "406":
          $ref: "common.yaml#/components/responses/NotAcceptableResponse"
        "412":
          $ref: "common.yaml#/components/responses/PreconditionFailedResponse"
        "415":
          $ref: "common.yaml#/components/responses/UnsupportedMediaTypeResponse"
        "429":
          $ref: "common.yaml#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "common.yaml#/components/responses/InternalServerErrorResponse"
        "503":
          $ref: "common.yaml#/components/responses/ServiceUnavailableResponse"

    delete:
      tags:
        - Entity Class
      operationId: deleteEntityClass
      summary: Delete entity class by ID
      parameters:
        - $ref: "common.yaml#/components/parameters/SubKeyPath"
        - $ref: "#/components/parameters/EntityClassPath"
        - $ref: "#/components/parameters/EntityClassVersionPath"
        - $ref: "common.yaml#/components/parameters/IfMatchHeader"
      responses:
        "200":
          $ref: "common.yaml#/components/responses/DeleteSuccessResponse"
        "400":
          $ref: "common.yaml#/components/responses/BadRequestResponse"
        "401":
          $ref: "common.yaml#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "common.yaml#/components/responses/ForbiddenClassModificationResponse"
        "404":
          $ref: "common.yaml#/components/responses/NotFoundResponse"
        "406":
          $ref: "common.yaml#/components/responses/NotAcceptableResponse"
        "412":
          $ref: "common.yaml#/components/responses/PreconditionFailedResponse"
        "429":
          $ref: "common.yaml#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "common.yaml#/components/responses/InternalServerErrorResponse"
        "503":
          $ref: "common.yaml#/components/responses/ServiceUnavailableResponse"

    put:
      tags:
        - Entity Class
      operationId: updateEntityClass
      summary: Update entity class with complete resource replacement
      parameters:
        - $ref: "common.yaml#/components/parameters/SubKeyPath"
        - $ref: "#/components/parameters/EntityClassPath"
        - $ref: "#/components/parameters/EntityClassVersionPath"
        - $ref: "common.yaml#/components/parameters/IfMatchHeader"
      requestBody:
        required: true
        x-codegen-request-body-name: updateRequest
        content:
          application/vnd.pubnub.objects.entity-class+json;version=1:
            schema:
              $ref: "#/components/schemas/UpdateEntityClassRequest"
      responses:
        "200":
          $ref: "#/components/responses/EntityClassResponse"
        "400":
          $ref: "common.yaml#/components/responses/BadRequestEntityClassWriteResponse"
        "401":
          $ref: "common.yaml#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "common.yaml#/components/responses/ForbiddenClassModificationResponse"
        "404":
          $ref: "common.yaml#/components/responses/NotFoundResponse"
        "406":
          $ref: "common.yaml#/components/responses/NotAcceptableResponse"
        "412":
          $ref: "common.yaml#/components/responses/PreconditionFailedResponse"
        "415":
          $ref: "common.yaml#/components/responses/UnsupportedMediaTypeResponse"
        "429":
          $ref: "common.yaml#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "common.yaml#/components/responses/InternalServerErrorResponse"
        "503":
          $ref: "common.yaml#/components/responses/ServiceUnavailableResponse"

  # Relationship Class endpoints
  /datasync/subkeys/{subKey}/relationship-classes:
    get:
      summary: Get all relationship classes
      operationId: listRelationshipClasses
      parameters:
        - $ref: "common.yaml#/components/parameters/SubKeyPath"
      responses:
        '200':
          $ref: '#/components/responses/RelationshipClassesResponse'
        "400":
          $ref: "common.yaml#/components/responses/BadRequestResponse"
        "401":
          $ref: "common.yaml#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "common.yaml#/components/responses/ForbiddenResponse"
        "406":
          $ref: "common.yaml#/components/responses/NotAcceptableResponse"
        "429":
          $ref: "common.yaml#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "common.yaml#/components/responses/InternalServerErrorResponse"
        "503":
          $ref: "common.yaml#/components/responses/ServiceUnavailableResponse"
      tags:
        - Relationship Class

  /datasync/subkeys/{subKey}/relationship-classes/{relationshipClass}/versions/{relationshipClassVersion}:
    post:
      operationId: createRelationshipClass
      summary: Create a new relationship class
      description: |
        Creates a new relationship class that defines a type of relationship between entities.
      parameters:
        - $ref: "common.yaml#/components/parameters/SubKeyPath"
        - $ref: "#/components/parameters/RelationshipClassPath"
        - $ref: "#/components/parameters/RelationshipClassVersionPath"
      tags:
        - Relationship Class
      requestBody:
        required: true
        content:
          application/vnd.pubnub.objects.relationship-class+json;version=1:
            schema:
              $ref: '#/components/schemas/CreateRelationshipClassRequest'
      responses:
        '201':
          $ref: "#/components/responses/CreateRelationshipClassResponse"
        '400':
          $ref: 'common.yaml#/components/responses/BadRequestRelationshipClassWriteResponse'
        '401':
          $ref: 'common.yaml#/components/responses/UnauthorizedResponse'
        '403':
          $ref: 'common.yaml#/components/responses/ForbiddenResponse'
        "406":
          $ref: "common.yaml#/components/responses/NotAcceptableResponse"
        '409':
          $ref: 'common.yaml#/components/responses/ConflictResponse'
        "415":
          $ref: "common.yaml#/components/responses/UnsupportedMediaTypeResponse"
        "429":
          $ref: "common.yaml#/components/responses/TooManyRequestsResponse"
        '500':
          $ref: 'common.yaml#/components/responses/InternalServerErrorResponse'
        '503':
          $ref: 'common.yaml#/components/responses/ServiceUnavailableResponse'

    get:
      tags:
        - Relationship Class
      operationId: getRelationshipClass
      summary: Get relationship class by name and version
      parameters:
        - $ref: "common.yaml#/components/parameters/SubKeyPath"
        - $ref: "#/components/parameters/RelationshipClassPath"
        - $ref: "#/components/parameters/RelationshipClassVersionPath"
      responses:
        "200":
          $ref: "#/components/responses/RelationshipClassResponse"
        "400":
          $ref: "common.yaml#/components/responses/BadRequestResponse"
        "401":
          $ref: "common.yaml#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "common.yaml#/components/responses/ForbiddenResponse"
        "404":
          $ref: "common.yaml#/components/responses/NotFoundResponse"
        "406":
          $ref: "common.yaml#/components/responses/NotAcceptableResponse"
        "429":
          $ref: "common.yaml#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "common.yaml#/components/responses/InternalServerErrorResponse"
        "503":
          $ref: "common.yaml#/components/responses/ServiceUnavailableResponse"

    put:
      tags:
        - Relationship Class
      operationId: updateRelationshipClass
      summary: Update relationship class with complete resource replacement
      parameters:
        - $ref: "common.yaml#/components/parameters/SubKeyPath"
        - $ref: "#/components/parameters/RelationshipClassPath"
        - $ref: "#/components/parameters/RelationshipClassVersionPath"
        - $ref: "common.yaml#/components/parameters/IfMatchHeader"
      requestBody:
        required: true
        x-codegen-request-body-name: updateRequest
        content:
          application/vnd.pubnub.objects.relationship-class+json;version=1:
            schema:
              $ref: "#/components/schemas/UpdateRelationshipClassRequest"
      responses:
        "200":
          $ref: "#/components/responses/RelationshipClassResponse"
        "400":
          $ref: "common.yaml#/components/responses/BadRequestRelationshipClassWriteResponse"
        "401":
          $ref: "common.yaml#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "common.yaml#/components/responses/ForbiddenClassModificationResponse"
        "404":
          $ref: "common.yaml#/components/responses/NotFoundResponse"
        "406":
          $ref: "common.yaml#/components/responses/NotAcceptableResponse"
        "412":
          $ref: "common.yaml#/components/responses/PreconditionFailedResponse"
        "415":
          $ref: "common.yaml#/components/responses/UnsupportedMediaTypeResponse"
        "429":
          $ref: "common.yaml#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "common.yaml#/components/responses/InternalServerErrorResponse"
        "503":
          $ref: "common.yaml#/components/responses/ServiceUnavailableResponse"

    delete:
      tags:
        - Relationship Class
      operationId: deleteRelationshipClass
      summary: Delete relationship class by name and version
      parameters:
        - $ref: "common.yaml#/components/parameters/SubKeyPath"
        - $ref: "#/components/parameters/RelationshipClassPath"
        - $ref: "#/components/parameters/RelationshipClassVersionPath"
        - $ref: "common.yaml#/components/parameters/IfMatchHeader"
      responses:
        "200":
          $ref: "common.yaml#/components/responses/DeleteSuccessResponse"
        "400":
          $ref: "common.yaml#/components/responses/BadRequestResponse"
        "401":
          $ref: "common.yaml#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "common.yaml#/components/responses/ForbiddenClassModificationResponse"
        "404":
          $ref: "common.yaml#/components/responses/NotFoundResponse"
        "406":
          $ref: "common.yaml#/components/responses/NotAcceptableResponse"
        "412":
          $ref: "common.yaml#/components/responses/PreconditionFailedResponse"
        "429":
          $ref: "common.yaml#/components/responses/TooManyRequestsResponse"
        "500":
          $ref: "common.yaml#/components/responses/InternalServerErrorResponse"
        "503":
          $ref: "common.yaml#/components/responses/ServiceUnavailableResponse"

components:
  responses:
    EntityClassesResponse:
      description: Successful response
      content:
        application/vnd.pubnub.objects.entity-class+json;version=1:
          schema:
            $ref: '#/components/schemas/EntityClassesEnvelope'
    CreateEntityClassResponse:
      description: Entity class created successfully
      headers:
        Location:
          schema:
            type: string
          description: URI of the created entity class
      content:
        application/vnd.pubnub.objects.entity-class+json;version=1:
          schema:
            $ref: '#/components/schemas/EntityClassEnvelope'
    EntityClassResponse:
      description: Successful response
      content:
        application/vnd.pubnub.objects.entity-class+json;version=1:
          schema:
            $ref: '#/components/schemas/EntityClassEnvelope'
    RelationshipClassesResponse:
      description: Successful response
      content:
        application/vnd.pubnub.objects.relationship-class+json;version=1:
          schema:
            $ref: '#/components/schemas/RelationshipClassesEnvelope'
    CreateRelationshipClassResponse:
      description: Relationship class created successfully
      headers:
        Location:
          schema:
            type: string
          description: URI of the created relationship class
      content:
        application/vnd.pubnub.objects.relationship-class+json;version=1:
          schema:
            $ref: '#/components/schemas/RelationshipClassEnvelope'
    RelationshipClassResponse:
      description: Successful response
      content:
        application/vnd.pubnub.objects.relationship-class+json;version=1:
          schema:
            $ref: '#/components/schemas/RelationshipClassEnvelope'
  parameters:
    EntityClassPath:
      name: entityClass
      in: path
      required: true
      schema:
        $ref: "common.yaml#/components/schemas/ClassName"
      description: Name of an entity class
    EntityClassVersionPath:
      name: entityClassVersion
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: Version of an entity class
    RelationshipClassPath:
      name: relationshipClass
      in: path
      required: true
      schema:
        $ref: "common.yaml#/components/schemas/ClassName"
      description: Name of a relationship class
    RelationshipClassVersionPath:
      name: relationshipClassVersion
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: Version of a relationship class

  schemas:
    CreateEntityClassRequest:
      description: Request body for creating an entity class
      allOf:
        - $ref: "common.yaml#/components/schemas/RequestEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/EntityClassProperties"

    UpdateEntityClassRequest:
      description: Request body for updating an entity class
      allOf:
        - $ref: "common.yaml#/components/schemas/RequestEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/EntityClassUpdateProperties"

    UpdateRelationshipClassRequest:
      description: Request body for updating a relationship class
      allOf:
        - $ref: "common.yaml#/components/schemas/RequestEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/RelationshipClassUpdateProperties"

    RelationshipClassUpdateProperties:
      description: Updatable properties for a relationship class
      type: object
      properties:
        description:
          type: string
          description: Optional description of the relationship class
        properties:
          type: array
          items:
            $ref: "#/components/schemas/Property"
          description: List of class properties (replaces existing properties on update)

    Property:
      type: object
      required: [path, valueKind, name]
      properties:
        name:
          type: string
          description: |
            Unique semantic identifier for the property.
        path:
          allOf:
            - $ref: 'common.yaml#/components/schemas/JsonPointer'
          description: |
            Pointer to the property value within the record. User-defined
            values live under `/payload/`, so a payload field named `username`
            has the path `/payload/username`.
          example: "/payload/username"
        valueKind:
          type: string
          enum: [string, number, boolean, date, datetime]
          description: |
            Data type of the property value.
        filtering:
          type: string
          nullable: true
          enum: [none, simple, full]
          description: |
            Controls search indexing for this property.
            - none: not searchable (default)
            - simple: stored in DB for SQL-based filter and sort
            - full: stored in DB and indexed for full-text search
        isNullable:
          type: boolean
          description: Whether the property can have null values.
          default: true
        projections:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name:
                type: string
                maxLength: 64
                pattern: '^(__default__|[a-zA-Z0-9][a-zA-Z0-9_-]*)$'
                description: |
                  Projection name. Must be alphanumeric with hyphens/underscores allowed.
                  The reserved name "__default__" is the only value permitted to start with "__".
          description: |
            Projections this field belongs to. Defaults to [{name: "__default__"}].
            Remove __default__ to restrict the field to named projections only.
            Max 3 distinct projection names per class.

    EntityClassesEnvelope:
      description: List of entity classes
      allOf:
        - $ref: 'common.yaml#/components/schemas/ResponseEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/EntityClassResource'

    EntityClassEnvelope:
      description: Single entity class
      allOf:
        - $ref: 'common.yaml#/components/schemas/ResponseEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/EntityClassResource'

    EntityClassResource:
      allOf:
        - $ref: '#/components/schemas/EntityClassResourceProperties'
        - $ref: '#/components/schemas/EntityClassProperties'
        - required: [config]

    EntityClassResourceProperties:
      description: Default properties for entity class responses (without id; a class
        is identified by the triplet name, level and version)
      type: object
      required:
        - createdAt
        - updatedAt
        - eTag
        - version
        - level
      properties:
        name:
          allOf:
            - $ref: "common.yaml#/components/schemas/ClassName"
            - description: Unique semantic identifier for the entity class.
        level:
          allOf:
            - $ref: "common.yaml#/components/schemas/ClassLevel"
          description: The level at which this class is defined.
        createdAt:
          type: string
          format: date-time
          description: Date and time the entity class was created.
        updatedAt:
          type: string
          format: date-time
          description: Date and time the entity class was last updated.
        eTag:
          type: string
          description: The entity's content fingerprint used in conditional requests.
        version:
          type: integer
          description: Version of an entity class

    EntityClassProperties:
      type: object
      properties:

        description:
          type: string
          maxLength: 1000
          description: Human-readable description documenting semantic intent and
            ownership scope.

        config:
          description: |
            Entity class configuration. Required when creating a standalone class (no extends).
            When extends is provided and config is omitted, the parent's config is inherited.
          allOf:
            - $ref: '#/components/schemas/EntityClassConfig'

        extends:
          $ref: '#/components/schemas/Extends'

        properties:
          type: array
          items:
            $ref: '#/components/schemas/Property'
          description: |
            Optional list of properties for searchable
            properties. If omitted, payload is treated as opaque JSON.
            When extending a parent class, parent properties are auto-inherited.
            Child may declare additional properties or override filtering/projections
            on inherited ones.
      example:
        name: "user-profile"
        description: "Entity class for storing user profile information including basic
          details and preferences"
        version: 1
        config:
          ttlSec: 2678400
        properties:
          - name: "username"
            path: "/payload/username"
            valueKind: "string"
            filtering: "full"
          - name: "email"
            path: "/payload/email"
            valueKind: "string"
            filtering: "simple"
            isNullable: true
          - name: "dateOfBirth"
            path: "/payload/dateOfBirth"
            valueKind: "date"
            filtering: "simple"
          - name: "isActive"
            path: "/payload/isActive"
            valueKind: "boolean"
            filtering: "simple"
          - name: "score"
            path: "/payload/score"
            valueKind: "number"
            filtering: "simple"

    EntityClassUpdateProperties:
      description: Properties for updating an entity class. Config is always required on update.
      type: object
      required: [config, properties]
      properties:
        description:
          type: string
          maxLength: 1000
          description: Human-readable description documenting semantic intent and
            ownership scope.
        config:
          $ref: '#/components/schemas/EntityClassConfig'
        properties:
          type: array
          items:
            $ref: '#/components/schemas/Property'
          description: |
            Optional list of properties for searchable
            properties. If omitted, existing properties are preserved.

    Extends:
      type: object
      description: Reference to the parent class this class extends.
      required: [name, version]
      properties:
        name:
          type: string
          description: Name of the parent class.
        version:
          type: integer
          description: Version of the parent class.

    EntityClassConfig:
      type: object
      required: [ttlSec]
      properties:
        ttlSec:
          type: integer
          minimum: 0
          maximum: 315569260
          description: |
            Time-to-live in seconds for entities of this class.
            Default is 31 days, maximum is 10 years
          default: 2678400

    # Relationship Class schemas
    CreateRelationshipClassRequest:
      description: Request body for creating a relationship class
      allOf:
        - $ref: "common.yaml#/components/schemas/RequestEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/RelationshipClassProperties"

    RelationshipClassesEnvelope:
      description: List of relationship classes
      allOf:
        - $ref: 'common.yaml#/components/schemas/ResponseEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/RelationshipClassResource'

    RelationshipClassEnvelope:
      description: Single relationship class
      allOf:
        - $ref: 'common.yaml#/components/schemas/ResponseEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RelationshipClassResource'

    RelationshipClassResource:
      allOf:
        - $ref: '#/components/schemas/RelationshipClassResourceProperties'
        - $ref: '#/components/schemas/RelationshipClassProperties'

    RelationshipClassResourceProperties:
      description: Default properties for relationship class responses
      type: object
      required:
        - name
        - createdAt
        - updatedAt
        - eTag
        - version
      properties:
        name:
          allOf:
            - $ref: "common.yaml#/components/schemas/ClassName"
            - description: Unique semantic identifier for the relationship class
        createdAt:
          type: string
          format: date-time
          description: Date and time the relationship class was created
        updatedAt:
          type: string
          format: date-time
          description: Date and time the relationship class was last updated
        eTag:
          type: string
          description: The relationship's content fingerprint used in conditional requests
        version:
          type: integer
          description: Version number of the relationship class

    RelationshipClassProperties:
      type: object
      required: [cardinality]
      properties:
        description:
          type: string
          maxLength: 1000
          description: Human-readable description documenting the relationship class purpose
        cardinality:
          $ref: '#/components/schemas/RelationshipClassCardinality'
        entityAClass:
          type: string
          description: |
            Name of the entity class for the source (A) side of the relationship.
            If omitted, any entity class can be used as the source.
        entityAClassLevel:
          allOf:
            - $ref: "common.yaml#/components/schemas/ClassLevel"
          description: |
            Class level to resolve entityAClass at. Defaults to standard resolution
            (SubKey → Global) if not specified.
        entityBClass:
          type: string
          description: |
            Name of the entity class for the target (B) side of the relationship.
            If omitted, any entity class can be used as the target.
        entityBClassLevel:
          allOf:
            - $ref: "common.yaml#/components/schemas/ClassLevel"
          description: |
            Class level to resolve entityBClass at. Defaults to standard resolution
            (SubKey → Global) if not specified.
        properties:
          type: array
          items:
            $ref: '#/components/schemas/Property'
          description: |
            Optional list of properties for searchable
            properties on relationships of this class.
      example:
        description: "Represents a parent-child relationship between entities"
        directed: true
        cardinality: "one-to-many"
        entityAClass: "Parent"
        entityBClass: "Child"
        properties:
          - name: "role"
            path: "/payload/role"
            valueKind: "string"
            filtering: "full"

    RelationshipClassCardinality:
      type: string
      enum: [one-to-one, one-to-many, many-to-many]
      description: |
        Defines multiplicity constraints for the relationship.
        - `one-to-one`: Each entity can participate in at most one relationship of this type
        - `one-to-many`: An entity is bound to the side it first appears on
        - `many-to-many`: No side constraints
