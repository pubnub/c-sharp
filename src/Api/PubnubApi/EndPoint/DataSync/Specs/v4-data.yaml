          schema:
            type: string
          description: URI of the created entity
      content:
        application/vnd.pubnub.objects.entity+json;version=1:
          schema:
            $ref: "#/components/schemas/EntityEnvelope"
    UsersResponse:
      description: Successful response
      content:
        application/vnd.pubnub.objects.user+json;version=1:
          schema:
            $ref: "#/components/schemas/UsersEnvelope"
    UserResponse:
