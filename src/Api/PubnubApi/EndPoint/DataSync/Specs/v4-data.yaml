      headers:
        Location:
          schema:
            type: string
          description: URI of the created user
      content:
        application/vnd.pubnub.objects.user+json;version=1:
          schema:
            $ref: "#/components/schemas/UserEnvelope"
    ChannelsResponse:
      description: Successful response
      content:
        application/vnd.pubnub.objects.channel+json;version=1:
          schema:
            $ref: "#/components/schemas/ChannelsEnvelope"
    ChannelResponse:
      description: Successful response
      content:
        application/vnd.pubnub.objects.channel+json;version=1:
          schema:
            $ref: "#/components/schemas/ChannelEnvelope"
    CreateChannelResponse:
      description: Channel created successfully
      headers:
        Location:
          schema:
            type: string
          description: URI of the created channel
      content:
        application/vnd.pubnub.objects.channel+json;version=1:
          schema:
            $ref: "#/components/schemas/ChannelEnvelope"
