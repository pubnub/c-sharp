components:
  responses:
    RelationshipsResponse:
      description: Successful response
      content:
        application/vnd.pubnub.objects.relationship+json;version=1:
          schema:
            $ref: "#/components/schemas/RelationshipsEnvelope"
    RelationshipResponse:
      description: Successful response
      content:
        application/vnd.pubnub.objects.relationship+json;version=1:
          schema:
            $ref: "#/components/schemas/RelationshipEnvelope"
    CreateRelationshipResponse:
      description: Relationship created successfully
      headers:
        Location:
          schema:
            type: string
          description: URI of the created relationship
      content:
        application/vnd.pubnub.objects.relationship+json;version=1:
          schema:
            $ref: "#/components/schemas/RelationshipEnvelope"
    EntitiesResponse:
      description: Successful response
      content:
